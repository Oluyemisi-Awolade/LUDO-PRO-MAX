name: Generate Upload Keystore (ONE-TIME — delete after use)

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key alias (any name, e.g. "upload")'
        required: true
        default: 'upload'
      password:
        description: 'Password to protect the keystore (write this down — you will need it forever)'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore upload-keystore.jks \
            -alias "${{ github.event.inputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.password }}" \
            -keypass "${{ github.event.inputs.password }}" \
            -dname "CN=Ludo Pro Max, OU=Joda, O=Joda, L=Lagos, S=Lagos, C=NG"

      - name: Base64-encode keystore (for pasting into a GitHub secret)
        run: base64 -w 0 upload-keystore.jks > upload-keystore.jks.b64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: upload-keystore
          path: |
            upload-keystore.jks
            upload-keystore.jks.b64
          retention-days: 1
