name: Import Existing Keystore (ONE-TIME — delete after use)

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'The alias you used when this keystore was created'
        required: true
      password:
        description: 'The password for this keystore'
        required: true

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify file exists
        run: |
          if [ ! -f "keystore-temp/upload-keystore.jks" ]; then
            echo "❌ keystore-temp/upload-keystore.jks not found. Upload it first."
            exit 1
          fi
          echo "✅ Found file, size:"
          ls -la keystore-temp/upload-keystore.jks

      # Fails fast with a clear message if alias/password don't actually
      # match this file — instead of silently pushing bad secrets again.
      - name: Verify alias/password match this keystore
        run: |
          keytool -list -v \
            -keystore keystore-temp/upload-keystore.jks \
            -alias "${{ github.event.inputs.alias }}" \
            -storepass "${{ github.event.inputs.password }}" \
            | grep -E "Alias name|SHA256"
          echo "✅ Alias and password confirmed correct for this file."

      - name: Push secrets directly to GitHub (no manual copying)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          base64 -w 0 keystore-temp/upload-keystore.jks > upload-keystore.jks.b64
          gh secret set KEYSTORE_BASE64 --repo "${{ github.repository }}" < upload-keystore.jks.b64
          gh secret set KEYSTORE_PASSWORD --repo "${{ github.repository }}" --body "${{ github.event.inputs.password }}"
          gh secret set KEY_PASSWORD --repo "${{ github.repository }}" --body "${{ github.event.inputs.password }}"
          gh secret set KEY_ALIAS --repo "${{ github.repository }}" --body "${{ github.event.inputs.alias }}"
          echo "✅ All 4 secrets set directly — verified correct."

      - name: Remove the temporary keystore file from the repo
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git rm keystore-temp/upload-keystore.jks
          git commit -m "Remove temporary keystore file (imported to secrets)"
          git push
          echo "✅ Temp file removed from the repo."
