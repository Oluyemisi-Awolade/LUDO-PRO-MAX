name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_DB_URL=${{ secrets.FIREBASE_DB_URL }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ludo-pro-max-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # ── Play Store build (only runs once KEYSTORE_BASE64 secret exists) ──
      # NOTE: this step and the one below are silently skipped until you've
      # generated a keystore (see generate-keystore.yml) and added the
      # KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
      # secrets in GitHub. Nothing here breaks your existing APK build in
      # the meantime.
      - name: Decode upload keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build App Bundle (Play Store)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          flutter build appbundle --release \
            --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_DB_URL=${{ secrets.FIREBASE_DB_URL }}

      - name: Upload AAB artifact
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ludo-pro-max-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
